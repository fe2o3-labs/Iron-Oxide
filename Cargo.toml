[workspace]
resolver = "3"
members = ["crates/iron-oxide-domain", "crates/iron-oxide-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/guizmaii-opensource/Iron-Oxide"

[workspace.dependencies]
# Pinned exactly: the `dx` CLI must be the same version as the `dioxus` crates (see README).
dioxus = { version = "=0.7.10" }
iron-oxide-domain = { path = "crates/iron-oxide-domain" }

# Server-only dependencies (enabled by the app's `server` feature, never compiled to wasm).
base64 = "0.23.1"
dotenvy = "0.15.7"
secrecy = "0.10.3"
# Held back on 0.8 (0.9.0 is the latest): `tower-sessions-sqlx-store` 0.15 (Postgres sessions, #5)
# depends on sqlx 0.8, and the session store must share our `PgPool` type.
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
  "macros",
  "migrate",
  "uuid",
  "time",
  "json",
] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter"] }
url = "2.5.8"

# Dev-dependencies for tests (tokio: the app also enables runtime features for its server build).
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# Set for wasm32 builds by .cargo/config.toml (web-sys unstable APIs such as Wake Lock).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(web_sys_unstable_apis)"] }

# Tests may use unwrap/expect/panic: see clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
