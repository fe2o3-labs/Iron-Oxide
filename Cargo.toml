[workspace]
resolver = "3"
members = ["crates/iron-oxide-domain", "crates/iron-oxide-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/fe2o3-labs/Iron-Oxide"

[workspace.dependencies]
# Pinned exactly: the `dx` CLI must be the same version as the `dioxus` crates (see README).
dioxus = { version = "=0.7.10" }
iron-oxide-domain = { path = "crates/iron-oxide-domain" }

# Shared by the server and the wasm client (#5, sign-in).
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.27.0", default-features = false, features = ["std", "serde"] }
# WebAuthn JSON types exchanged by the server functions. Same version as `webauthn-rs`, which pins
# it exactly. No `wasm` feature: its conversions unwrap, the client has its own (auth/browser.rs).
webauthn-rs-proto = { version = "=0.5.5", default-features = false }

# Browser-only dependencies (the app's `web` feature). Same versions as Dioxus already uses.
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"

# Server-only dependencies (enabled by the app's `server` feature, never compiled to wasm).
async-trait = "0.1.92"
base64 = "0.23.1"
dotenvy = "0.15.7"
# Sign in with Google (#5). Its `reqwest` feature pulls reqwest 0.12 (0.13 is the latest; openidconnect
# 4.0.1, its latest release, requires 0.12). We use it through `openidconnect::reqwest`.
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
secrecy = "0.10.3"
# Held back on 0.8 (0.9.0 is the latest), capped in Renovate. The original reason
# (`tower-sessions-sqlx-store`) no longer applies: #5 uses its own session store. Moving to 0.9 is
# a separate change (sqlx-cli, `.sqlx`, the Renovate cap).
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
  "macros",
  "migrate",
  "uuid",
  "time",
  "json",
] }
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
time = "0.3.55"
# Sessions (#5). Our own Postgres store (server/auth/session.rs) implements its `SessionStore`.
tower-sessions = { version = "0.15.0", default-features = false, features = ["axum-core", "signed"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
url = "2.5.8"
# Passkeys (#5). 0.5.5 is the latest stable release (0.6 is only published as `-dev`
# pre-releases). Links the system OpenSSL through webauthn-rs-core.
# - `danger-allow-state-serialisation`: ceremony state is stored server-side in Postgres, so it
#   must serialize. It never leaves the server.
# - `conditional-ui`: enables the discoverable (username-less) authentication API.
webauthn-rs = { version = "0.5.5", default-features = false, features = [
  "danger-allow-state-serialisation",
  "conditional-ui",
] }

# Test-only: a software passkey for WebAuthn ceremony tests, and OpenSSL (already linked by
# webauthn-rs-core) to generate the mock Google signing key.
openssl = "0.10.81"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }

# Test-only: a request body sent in chunks, or never finished (#74). Already in the tree via axum.
http-body = "1.1.0"

# Dev-dependencies for tests (tokio: the app also enables runtime features for its server build).
# serde_json is also a server dependency of the app (jsonb columns).
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# Set for wasm32 builds by .cargo/config.toml (web-sys unstable APIs such as Wake Lock).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(web_sys_unstable_apis)"] }

# Tests may use unwrap/expect/panic: see clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Lean debug info for dev builds, to keep target dirs small: line tables only for our crates
# (backtraces keep file:line), none for dependencies. dx's dev profiles (`server-dev`,
# `wasm-dev`) are defined ad hoc by dx with `inherits = "dev"`, so they get this too; defining
# them here would switch off dx's own profile tweaks.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
