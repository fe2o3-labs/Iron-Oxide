[package]
name = "iron-oxide-domain"
description = "Pure domain logic for Iron Oxide: no Dioxus, web-sys or sqlx dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["uuid"]
# Time-ordered `new_v7()` constructors for the typed IDs. `uuid/js` is target-gated by the uuid
# crate: it only pulls wasm-bindgen on `wasm32-unknown-unknown`, where the clock is `Date.now()`
# and the random bits come from `crypto.getRandomValues` (elsewhere: `SystemTime` and the OS RNG).
uuid = ["uuid/v7", "uuid/js"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
uuid = { version = "1.26.1", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.151"

[lints]
workspace = true
