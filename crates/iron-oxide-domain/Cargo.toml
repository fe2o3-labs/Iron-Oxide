[package]
name = "iron-oxide-domain"
description = "Pure domain logic for Iron Oxide: no Dioxus, web-sys or sqlx dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["uuid"]
# Time-ordered `new_v7()` constructors for the typed IDs. `uuid/js` is target-gated by the uuid
# crate: it only pulls wasm-bindgen on `wasm32-unknown-unknown`, where the clock is `Date.now()`
# and the random bits come from `crypto.getRandomValues` (elsewhere: `SystemTime` and the OS RNG).
uuid = ["uuid/v7", "uuid/js"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# Program documents (`program` module): parsing with line/column, and the JSON path of a parse error.
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
uuid = { version = "1.26.1", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
# Validates the built-in programs and fixtures against the committed `schemas/program.schema.json`.
# No default features: they add HTTP and file resolvers for remote `$ref`s, which this schema has none of.
jsonschema = { version = "0.58.1", default-features = false }
proptest = "1.11.0"
# Generates `schemas/program.schema.json` in a unit test. Dev-only, so the derives are
# `cfg_attr(test, ...)` and never reach the wasm client or the server.
schemars = "1.2.2"

[lints]
workspace = true
