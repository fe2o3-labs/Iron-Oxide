[package]
name = "iron-oxide-app"
description = "Iron Oxide Dioxus fullstack app: the web client (wasm) and the axum server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
iron-oxide-domain = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }

[features]
default = []
# Browser client, compiled to wasm32-unknown-unknown.
web = ["dioxus/web"]
# axum server: server functions, SSR, and custom routes such as /healthz.
server = ["dioxus/server"]

[lints]
workspace = true
