[package]
name = "iron-oxide-app"
description = "Iron Oxide Dioxus fullstack app: the web client (wasm) and the axum server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
iron-oxide-domain = { workspace = true }

# Server-only: optional, enabled by the `server` feature so the wasm client never pulls them in.
base64 = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
tracing-subscriber = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }

[features]
default = []
# Browser client, compiled to wasm32-unknown-unknown.
web = ["dioxus/web"]
# axum server: server functions, SSR, and custom routes such as /healthz.
server = [
  "dioxus/server",
  "dep:base64",
  "dep:dotenvy",
  "dep:secrecy",
  "dep:sqlx",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing-subscriber",
  "dep:url",
]

[lints]
workspace = true
