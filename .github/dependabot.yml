# Keep every dependency on its latest stable version. Minor and patch updates are grouped into one
# weekly PR per ecosystem; major updates get their own PRs.
# Note: bumping `dioxus` also requires bumping DX_VERSION and DX_SHA256 in .github/workflows/ci.yml.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Dockerfile (added with #7).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # docker compose file for local Postgres (added with #4).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-compose-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
