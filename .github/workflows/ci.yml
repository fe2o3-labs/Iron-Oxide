name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (whose base is not `main`) get CI too.
  # `edited` re-runs CI when a PR is retargeted (e.g. a stacked PR moved to `main` after its base
  # is merged), so the checks are computed against the new base. It also fires on title/body
  # edits; that costs a run but is harmless. Never skip jobs on `edited`: a skipped required check
  # counts as passing and would replace a real result on the same commit.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

# PRs: a new run cancels the superseded one. Pushes to main: one group per commit, so no push run is
# ever cancelled or dropped (each one scans only its own pushed range, see the gitleaks job).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # sqlx macros must compile from the committed `.sqlx/` metadata, never from a live database.
  SQLX_OFFLINE: "true"

jobs:
  # The repo is public and built in the open: a leaked secret must fail CI.
  # Scans only the new commits: the PR's commits on a pull request, the pushed range on a push to
  # main. The weekly full-history scan of main is in secret-scan.yml.
  # The gitleaks binary is used directly because `gitleaks/gitleaks-action`
  # requires a paid license for organisation-owned repositories.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          # Verified against the checksums published with the release.
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan the new commits
        # PR: the PR's own commits (base..head). Push to main: the pushed range. Manual run: the
        # whole history of the checked-out branch. `--remerge-diff` also scans what each merge
        # commit changed relative to git's automatic merge (conflict resolutions, evil merges);
        # without it `git log -p` shows no diff for merges. Not `-m`: it diffs a merge against its
        # first parent and would re-report the base branch's content under the merge's SHA. The weekly full-history scan of main is in
        # secret-scan.yml. Never the gitleaks default (`git log --all`), which would scan every
        # branch fetched by `fetch-depth: 0` and fail this run for someone else's commit.
        # Known false positives: see "Secrets" in SECURITY.md (`gitleaks:allow`, `.gitleaksignore`).
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request)
              range="${PR_BASE_SHA}..${PR_HEAD_SHA}" ;;
            push)
              if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="${PUSH_BEFORE}..${GITHUB_SHA}"
              else
                # New branch or force push: the previous tip is unknown, scan everything.
                range="HEAD"
              fi ;;
            *)
              range="HEAD" ;;
          esac
          echo "Scanning commits: $range"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 --log-opts="--remerge-diff $range" .

  # Rust jobs: they always run (no skip gate). Each one runs a target of the Makefile, so that
  # `make check` runs the same commands locally. A skipped required check counts as passing, so a gate
  # could let a PR merge without any Rust check.

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - run: make fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # No features; the app with `server`; the app with `web` on wasm32.
      - name: clippy
        run: make lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Tests that need Postgres are `#[ignore = "needs Postgres"]` and run in the integration job.
      # The workspace (no features), the app with the server feature, the domain crate with plain
      # cargo, and the service worker's caching rule with the runner's Node.js (node:test).
      - name: Unit tests
        run: make test
      # The Makefile's own guards (deploy, clean, check), in a scratch repository with stub tools.
      - name: Makefile guard tests
        run: make test-make

  # Builds the whole workspace with SQLX_OFFLINE=true (set globally above), so a query whose
  # `.sqlx/` metadata is missing or stale fails CI without needing a database.
  sqlx-offline:
    name: sqlx offline build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The workspace, then the app with the `server` feature, where the sqlx queries live.
      - run: make sqlx-check

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose.yml and the Neon major version.
        image: postgres:18.6-alpine
        # Throwaway credentials for an ephemeral CI container; not a secret.
        env:
          POSTGRES_USER: iron_oxide
          POSTGRES_PASSWORD: iron_oxide
          POSTGRES_DB: iron_oxide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U iron_oxide -d iron_oxide_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Given from outside, so `make test-db` uses this service instead of starting docker compose.
      TEST_DATABASE_URL: postgres://iron_oxide:iron_oxide@localhost:5432/iron_oxide_test
      # Must match the `sqlx` version in Cargo.toml (held back on 0.8, see there).
      # renovate: datasource=crate depName=sqlx-cli
      SQLX_CLI_VERSION: 0.8.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install sqlx-cli
        run: |
          if ! sqlx --version 2>/dev/null | grep -q "$SQLX_CLI_VERSION"; then
            cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --locked \
              --no-default-features --features postgres,rustls
          fi
      # Applies the migrations, checks the committed `.sqlx/` query data (fails if it is missing a
      # query or holds a stale one: re-run `make sqlx-prepare`), then runs the tests that need
      # Postgres (each `sqlx::test` gets its own fresh database on this server), and fails if any
      # of them silently did not run (scripts/check-postgres-tests.sh).
      - name: Postgres tests and sqlx query data
        run: make test-db

  # Builds the release bundle exactly as the Dockerfile (#7) will, then runs the server and checks
  # the page, a server function round-trip, /healthz and /readyz over HTTP, and a graceful
  # shutdown on SIGTERM.
  dx-bundle:
    name: dx bundle + smoke test
    runs-on: ubuntu-latest
    # The server connects to Postgres and applies the migrations at startup.
    services:
      postgres:
        image: postgres:18.6-alpine
        # Throwaway credentials for an ephemeral CI container; not a secret.
        env:
          POSTGRES_USER: iron_oxide
          POSTGRES_PASSWORD: iron_oxide
          POSTGRES_DB: iron_oxide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U iron_oxide -d iron_oxide"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Must match the `dioxus` crate version in Cargo.toml (Renovate bumps both in one PR).
      # renovate: datasource=crate depName=dioxus-cli
      DX_VERSION: 0.7.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dx (Dioxus CLI)
        run: |
          # Official prebuilt binary, verified against the checksum published with the release.
          cd "$RUNNER_TEMP"
          base="https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}"
          archive="dx-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/dx-x86_64-unknown-linux-gnu.sha256"
          grep " ${archive}\$" dx-x86_64-unknown-linux-gnu.sha256 | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME/.cargo/bin" dx
          dx --version
      # `make smoke` builds the bundle (`make build`), then scripts/smoke-test.sh runs the server
      # against this database and checks it over HTTP.
      - name: dx bundle --web --release + smoke test
        env:
          SMOKE_DATABASE_URL: postgres://iron_oxide:iron_oxide@localhost:5432/iron_oxide
          SMOKE_LOG: ${{ runner.temp }}/server.log
        run: make smoke
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true
