name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (whose base is not `main`) get CI too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # sqlx macros must compile from the committed `.sqlx/` metadata, never from a live database.
  SQLX_OFFLINE: "true"

jobs:
  # The repo is public and built in the open: a leaked secret must fail CI.
  # Scans only the new commits: the PR's commits on a pull request, the pushed range on a push to
  # main. The weekly full-history scan of main is in secret-scan.yml.
  # The gitleaks binary is used directly because `gitleaks/gitleaks-action`
  # requires a paid license for organisation-owned repositories.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          # Verified against the checksums published with the release.
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan the new commits
        # PR: the PR's own commits (base..head). Push to main: the pushed range. Manual run: the
        # whole history of the checked-out branch. The weekly full-history scan of main is in
        # secret-scan.yml. Never the gitleaks default (`git log --all`), which would scan every
        # branch fetched by `fetch-depth: 0` and fail this run for someone else's commit.
        # Known false positives: see "Secrets" in SECURITY.md (`gitleaks:allow`, `.gitleaksignore`).
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request)
              range="${PR_BASE_SHA}..${PR_HEAD_SHA}" ;;
            push)
              if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="${PUSH_BEFORE}..${GITHUB_SHA}"
              else
                # New branch or force push: the previous tip is unknown, scan everything.
                range="HEAD"
              fi ;;
            *)
              range="HEAD" ;;
          esac
          echo "Scanning commits: $range"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 --log-opts="--no-merges $range" .

  # The Rust jobs below are skipped until a root `Cargo.toml` exists (it lands with #2).
  detect:
    name: Detect Rust workspace
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: clippy (no features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (app, server)
        run: cargo clippy -p iron-oxide-app --all-targets --features server --locked -- -D warnings
      - name: clippy (app, web on wasm32)
        run: cargo clippy -p iron-oxide-app --target wasm32-unknown-unknown --features web --locked -- -D warnings

  test:
    name: Unit tests
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Tests that need Postgres are `#[ignore = "needs Postgres"]` and run in the integration job.
      - name: Test the workspace (no features)
        run: cargo test --workspace --locked
      - name: Test the app with the server feature
        run: cargo test -p iron-oxide-app --features server --locked
      - name: Domain crate builds and tests with plain cargo
        run: cargo test -p iron-oxide-domain --locked

  # Builds the whole workspace with SQLX_OFFLINE=true (set globally above), so a query whose
  # `.sqlx/` metadata is missing or stale fails CI without needing a database.
  sqlx-offline:
    name: sqlx offline build
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --locked
      # The sqlx queries live behind the app's `server` feature.
      - run: cargo check -p iron-oxide-app --all-targets --features server --locked

  integration:
    name: Integration tests (Postgres)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose.yml and the Neon major version.
        image: postgres:18.6-alpine
        # Throwaway credentials for an ephemeral CI container; not a secret.
        env:
          POSTGRES_USER: iron_oxide
          POSTGRES_PASSWORD: iron_oxide
          POSTGRES_DB: iron_oxide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U iron_oxide -d iron_oxide_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://iron_oxide:iron_oxide@localhost:5432/iron_oxide_test
      # Must match the `sqlx` version in Cargo.toml (held back on 0.8, see there).
      # renovate: datasource=crate depName=sqlx-cli
      SQLX_CLI_VERSION: 0.8.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install sqlx-cli
        run: |
          if ! sqlx --version 2>/dev/null | grep -q "$SQLX_CLI_VERSION"; then
            cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --locked \
              --no-default-features --features postgres,rustls
          fi
      - name: Apply the migrations
        run: sqlx migrate run --source crates/iron-oxide-app/migrations
      # Fails if `.sqlx/` is missing a query or holds a stale one: re-run `cargo sqlx prepare`.
      - name: Check the committed sqlx query data
        env:
          SQLX_OFFLINE: "false"
        run: cargo sqlx prepare --workspace --check -- --all-targets --features iron-oxide-app/server
      # Each `sqlx::test` gets its own fresh database on this server.
      - name: Run the tests that need Postgres
        run: |
          cargo test --workspace --locked -- --ignored
          cargo test -p iron-oxide-app --features server --locked -- --ignored

  # Builds the release bundle exactly as the Dockerfile (#7) will, then runs the server and checks
  # the page, a server function round-trip, /healthz and /readyz over HTTP, and a graceful
  # shutdown on SIGTERM.
  dx-bundle:
    name: dx bundle + smoke test
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # The server connects to Postgres and applies the migrations at startup.
    services:
      postgres:
        image: postgres:18.6-alpine
        # Throwaway credentials for an ephemeral CI container; not a secret.
        env:
          POSTGRES_USER: iron_oxide
          POSTGRES_PASSWORD: iron_oxide
          POSTGRES_DB: iron_oxide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U iron_oxide -d iron_oxide"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Must match the `dioxus` crate version in Cargo.toml (Renovate bumps both in one PR).
      # renovate: datasource=crate depName=dioxus-cli
      DX_VERSION: 0.7.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dx (Dioxus CLI)
        run: |
          # Official prebuilt binary, verified against the checksum published with the release.
          cd "$RUNNER_TEMP"
          base="https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}"
          archive="dx-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/dx-x86_64-unknown-linux-gnu.sha256"
          grep " ${archive}\$" dx-x86_64-unknown-linux-gnu.sha256 | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME/.cargo/bin" dx
          dx --version
      - name: dx bundle --web --release
        run: dx bundle --web --release -p iron-oxide-app
      - name: Smoke test the bundled server
        run: |
          bundle=target/dx/iron-oxide-app/release/web
          ls -la "$bundle"
          cd "$bundle"
          IP=127.0.0.1 PORT=8080 APP_BASE_URL=http://127.0.0.1:8080 \
            DATABASE_URL=postgres://iron_oxide:iron_oxide@localhost:5432/iron_oxide \
            ./server > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz > /dev/null && break
            sleep 1
          done
          set -x
          test "$(curl -sSf http://127.0.0.1:8080/healthz)" = "ok"
          test "$(curl -sSf http://127.0.0.1:8080/readyz)" = "ok"
          curl -sSf http://127.0.0.1:8080/ | grep -q "Iron Oxide"
          curl -sSf http://127.0.0.1:8080/api/server-time | grep -Eq '^[0-9]+$'
          # The wasm client that hydrates the page is served: the JS loader referenced by the page
          # and every .wasm file of the bundle (with the MIME type browsers require).
          js=$(curl -sSf http://127.0.0.1:8080/ | grep -oE 'src="[^"]*\.js"' | head -1 | cut -d'"' -f2)
          test -n "$js"
          curl -sSf -o /dev/null "http://127.0.0.1:8080${js}"
          wasm_files=$(find public -name '*.wasm')
          test -n "$wasm_files"
          for f in $wasm_files; do
            curl -sSf -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:8080/${f#public/}" | grep -q '^application/wasm'
          done
          # The startup migrations ran.
          test "$(PGPASSWORD=iron_oxide psql -h localhost -U iron_oxide -d iron_oxide -tAc "SELECT to_regclass('users')")" = "users"
          # SIGTERM (what Fly sends on deploy) stops it cleanly with status 0.
          kill -TERM "$server_pid"
          wait "$server_pid"
          grep -q "shut down" "$RUNNER_TEMP/server.log"
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true
